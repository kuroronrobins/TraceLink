services:
  postgres:
    image: postgres:16-alpine
    container_name: tracelink-postgres-smoke
    environment:
      POSTGRES_DB: tracelink_smoke
      POSTGRES_USER: tracelink_admin
      POSTGRES_PASSWORD: tracelink_smoke_password
    ports:
      - "55432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tracelink_admin -d tracelink_smoke"]
      interval: 5s
      timeout: 3s
      retries: 20
    volumes:
      - tracelink_postgres_smoke:/var/lib/postgresql/data

volumes:
  tracelink_postgres_smoke:
